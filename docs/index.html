<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1f8a4c">
<meta name="color-scheme" content="light">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Dice Merge</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  color-scheme: light;   /* εμποδίζει την αυτόματη σκούρα λειτουργία του Android */
  --gap:6px;
  --felt:#2fa05a;
  --felt2:#1a7a40;
  --slot:rgba(0,0,0,.10);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;margin:0;}
body{
  background:radial-gradient(120% 80% at 50% 10%, #46c072 0%, var(--felt) 48%, var(--felt2) 100%);
  color:#fff;
  font-family:'Segoe UI',system-ui,-apple-system,Roboto,sans-serif;
  display:flex;flex-direction:column;align-items:center;
  overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
}
#app{width:100%;max-width:440px;height:100%;display:flex;flex-direction:column;justify-content:center;padding:10px 12px 12px;}

header{display:flex;align-items:center;gap:6px;margin-bottom:10px;}
.pill{background:rgba(0,0,0,.22);border-radius:999px;padding:6px 13px;display:flex;align-items:center;gap:7px;
  box-shadow:inset 0 2px 6px rgba(0,0,0,.2);}
.pill .lbl{font-size:11px;letter-spacing:.1em;opacity:.75;text-transform:uppercase;}
.pill .val{font-size:19px;font-weight:900;text-shadow:0 2px 3px rgba(0,0,0,.3);}
.spacer{flex:1;}
button.ui{background:rgba(0,0,0,.22);color:#fff;border:none;border-radius:999px;width:37px;height:37px;
  font-size:16px;font-weight:800;cursor:pointer;box-shadow:inset 0 2px 6px rgba(0,0,0,.2);}
button.ui:active{transform:translateY(1px);}
button.ui:disabled{opacity:.35;}

#boardWrap{position:relative;width:100%;aspect-ratio:1/1;border-radius:24px;background:rgba(0,0,0,.07);
  padding:var(--gap);box-shadow:inset 0 0 40px rgba(0,0,0,.12);}
#boardWrap.shake{animation:shake .38s;}
@keyframes shake{0%,100%{transform:translate(0,0)}15%{transform:translate(-6px,3px) rotate(-.6deg)}
  30%{transform:translate(6px,-3px) rotate(.6deg)}45%{transform:translate(-5px,-2px)}
  60%{transform:translate(5px,2px)}80%{transform:translate(-2px,1px)}}
#board{position:relative;width:100%;height:100%;display:grid;grid-template-columns:repeat(6,1fr);
  grid-template-rows:repeat(6,1fr);gap:var(--gap);}
.slot{background:var(--slot);border-radius:14px;box-shadow:inset 0 2px 4px rgba(0,0,0,.10);}
.slot.hl{background:rgba(255,255,255,.28);box-shadow:inset 0 0 0 3px rgba(255,255,255,.65);}
#dice{position:absolute;inset:var(--gap);pointer-events:none;}
#fx{position:absolute;inset:var(--gap);pointer-events:none;overflow:visible;}

/* die — fake 3D */
.die{position:absolute;border-radius:24%;
  background:linear-gradient(170deg,var(--c1) 0%,var(--c2) 62%,var(--c3) 100%);
  box-shadow:0 var(--lip) 0 var(--cdark), 0 calc(var(--lip) + 3px) 8px rgba(0,0,0,.30),
    inset 0 2px 2px rgba(255,255,255,.55), inset 0 -2px 3px rgba(0,0,0,.12);
  display:flex;align-items:center;justify-content:center;
  transition:left .12s ease, top .12s ease;}
.die .pips{width:70%;height:70%;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);}
.die .pips span{display:flex;align-items:center;justify-content:center;}
.die .pips i{width:78%;aspect-ratio:1/1;border-radius:50%;background:var(--pip);
  box-shadow:0 1px 1px rgba(0,0,0,.25), inset 0 -1px 2px rgba(0,0,0,.18);}
.die.pop{animation:pop .26s cubic-bezier(.34,1.56,.64,1);}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.32)}100%{transform:scale(1)}}
.die.suck{transition:left .14s ease-in, top .14s ease-in, transform .14s ease-in, opacity .14s ease-in;
  transform:scale(.25);opacity:0;}
.die.spawn{animation:spawn .22s cubic-bezier(.34,1.56,.64,1);}
@keyframes spawn{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}

.die.magic{background:linear-gradient(170deg,#fff3b0 0%,#ffcf3f 55%,#f0a91c 100%);
  animation:mglow 1.6s ease-in-out infinite;}
@keyframes mglow{
  0%,100%{box-shadow:0 var(--lip) 0 #b97c0d,0 calc(var(--lip)+3px) 8px rgba(0,0,0,.3),0 0 0 rgba(255,214,80,0),inset 0 2px 2px rgba(255,255,255,.6);}
  50%{box-shadow:0 var(--lip) 0 #b97c0d,0 calc(var(--lip)+3px) 8px rgba(0,0,0,.3),0 0 20px rgba(255,220,90,.95),inset 0 2px 2px rgba(255,255,255,.8);}}
.die.magic .star{width:66%;height:66%;filter:drop-shadow(0 1px 1px rgba(0,0,0,.3));}
.die.magic .shine{position:absolute;inset:0;border-radius:24%;overflow:hidden;pointer-events:none;}
.die.magic .shine::after{content:'';position:absolute;top:-60%;left:-120%;width:60%;height:220%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.75),transparent);
  transform:rotate(18deg);animation:sweep 2.4s linear infinite;}
@keyframes sweep{0%{left:-120%}55%{left:130%}100%{left:130%}}

/* fx */
.ring{position:absolute;border-radius:50%;border:4px solid rgba(255,255,255,.9);
  transform:translate(-50%,-50%) scale(.2);animation:ring .5s ease-out forwards;}
@keyframes ring{to{transform:translate(-50%,-50%) scale(2.2);opacity:0;border-width:1px;}}
.boom{position:absolute;border-radius:50%;transform:translate(-50%,-50%) scale(.15);
  background:radial-gradient(circle,#fffbe6 0%,#ffd34a 35%,#ff8c2b 60%,rgba(255,80,0,0) 72%);
  animation:boom .55s ease-out forwards;}
@keyframes boom{60%{opacity:1}to{transform:translate(-50%,-50%) scale(1.5);opacity:0}}
.spark{position:absolute;width:9px;height:9px;border-radius:50%;
  background:radial-gradient(circle,#fff 0%,#ffd44a 55%,rgba(255,150,0,0) 70%);
  transform:translate(-50%,-50%);animation:spark .6s ease-out forwards;}
@keyframes spark{to{opacity:0;transform:translate(calc(-50% + var(--tx)),calc(-50% + var(--ty))) scale(.3)}}
.float{position:absolute;font-weight:900;color:#fff;font-size:19px;text-shadow:0 2px 5px rgba(0,0,0,.5);
  animation:fl .85s ease forwards;z-index:6;}
@keyframes fl{to{transform:translateY(-50px);opacity:0}}

/* tray: one piece inside a round well with rotate arrows */
#tray{flex:0 0 auto;display:flex;align-items:center;justify-content:center;margin-top:10px;}
#well{position:relative;border-radius:50%;
  background:radial-gradient(circle at 50% 42%, rgba(0,0,0,.16) 0%, rgba(0,0,0,.10) 58%, rgba(255,255,255,.06) 72%, rgba(255,255,255,0) 78%);
  box-shadow:inset 0 6px 16px rgba(0,0,0,.18), inset 0 -3px 10px rgba(255,255,255,.07);
  display:flex;align-items:center;justify-content:center;cursor:pointer;}
#arrows{position:absolute;inset:0;pointer-events:none;
  filter:drop-shadow(0 2px 3px rgba(0,0,0,.12));}
#arrows path{fill:rgba(255,255,255,.34);stroke:none;}
#well.spin #arrows{animation:spinA .26s cubic-bezier(.1,.78,.2,1);}
@keyframes spinA{from{transform:rotate(0deg)}to{transform:rotate(180deg)}}
#well.spin #piece{animation:spinP .26s cubic-bezier(.1,.78,.2,1);}
@keyframes spinP{0%{transform:scale(.9)}55%{transform:scale(1.05)}100%{transform:scale(1)}}
#piece{position:relative;}
#piece.used{opacity:0;}
#piece .die{transition:none;}

#drag{position:fixed;left:0;top:0;pointer-events:none;z-index:50;display:none;}
#drag .die{transition:none;}

#over{position:absolute;inset:0;background:rgba(6,40,20,.88);border-radius:24px;display:none;
  flex-direction:column;align-items:center;justify-content:center;gap:8px;z-index:30;}
#over.show{display:flex;}
#over h2{margin:0;font-size:27px;}
#over p{margin:0;opacity:.75;font-size:14px;}
#over .big{font-size:42px;font-weight:900;color:#ffd34a;}
#over button{margin-top:10px;background:#ffd34a;color:#1c5c33;border:none;border-radius:16px;
  padding:13px 30px;font-size:17px;font-weight:900;box-shadow:0 5px 0 #c99a1e;cursor:pointer;}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="pill"><span class="lbl">Σκορ</span><span class="val" id="score">0</span></div>
    <div class="pill"><span class="lbl">Ρεκόρ</span><span class="val" id="best">0</span></div>
    <div class="spacer"></div>
    <button class="ui" id="sndBtn" title="Ήχος">🔊</button>
    <button class="ui" id="undoBtn" title="Πίσω">↶</button>
    <button class="ui" id="newBtn" title="Νέο">⟳</button>
  </header>

  <div id="boardWrap">
    <div id="board"></div>
    <div id="dice"></div>
    <div id="fx"></div>
    <div id="over">
      <h2>Τέλος παιχνιδιού</h2>
      <p>Σκορ</p><div class="big" id="finalScore">0</div>
      <p id="bestMsg"></p>
      <button id="againBtn">Ξανά</button>
    </div>
  </div>

  <div id="tray">
    <div id="well">
      <svg id="arrows" viewBox="0 0 200 200">
        <path d="M 17.3 69.9
                 A 88 88 0 0 1 179.8 62.8
                 L 189.5 57.5 L 177 106 L 153 75.8
                 L 161.6 71.3
                 A 76 76 0 0 0 22.9 72.0 Z"/>
        <path transform="rotate(180 100 100)"
              d="M 17.3 69.9
                 A 88 88 0 0 1 179.8 62.8
                 L 189.5 57.5 L 177 106 L 153 75.8
                 L 161.6 71.3
                 A 76 76 0 0 0 22.9 72.0 Z"/>
      </svg>
      <div id="piece"></div>
    </div>
  </div>
</div>
<div id="drag"></div>

<script>
(function(){
"use strict";

const N=6, MAGIC=7;
const SKIN={
  1:{c1:'#ffffff',c2:'#f1f3f8',c3:'#dde2ec',d:'#b9c1d0',pip:'#495166'},
  2:{c1:'#a8ee7e',c2:'#79d94f',c3:'#5cc236',d:'#3f9421',pip:'#ffffff'},
  3:{c1:'#7edcff',c2:'#3fc0f5',c3:'#22a7e0',d:'#1782ae',pip:'#ffffff'},
  4:{c1:'#ffd08a',c2:'#ffab2e',c3:'#f7911a',d:'#c96f0c',pip:'#ffffff'},
  5:{c1:'#cbb0ff',c2:'#a375ff',c3:'#8a56f0',d:'#6739bf',pip:'#ffffff'},
  6:{c1:'#ff9a9a',c2:'#ff5a5f',c3:'#ee3b41',d:'#bc2328',pip:'#ffffff'},
  7:{c1:'#fff3b0',c2:'#ffcf3f',c3:'#f0a91c',d:'#b97c0d',pip:'#7a5200'}
};
const PIP={1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};
const STAR='<svg class="star" viewBox="0 0 24 24"><defs><linearGradient id="sg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffdf0"/><stop offset="1" stop-color="#ff9d00"/></linearGradient></defs><path fill="url(#sg)" stroke="#a66a00" stroke-width="1.1" stroke-linejoin="round" d="M12 2.6l2.9 5.9 6.5.95-4.7 4.6 1.1 6.45L12 17.45 6.2 20.5l1.1-6.45-4.7-4.6 6.5-.95z"/></svg>';

/* ---------- sound (synthesised, no files, works offline) ---------- */
const SND=(function(){
  let ctx=null, on=true;
  function ac(){
    if(!ctx){ try{ ctx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; } }
    if(ctx.state==='suspended') ctx.resume();
    return ctx;
  }
  function beep(freq,dur,type,vol,slide,delay){
    if(!on) return; const c=ac(); if(!c) return;
    const t=c.currentTime+(delay||0);
    const o=c.createOscillator(), g=c.createGain();
    o.type=type||'sine';
    o.frequency.setValueAtTime(freq,t);
    if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(20,slide),t+dur);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(vol,t+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g); g.connect(c.destination);
    o.start(t); o.stop(t+dur+0.03);
  }
  function noise(dur,f0,f1,vol){
    if(!on) return; const c=ac(); if(!c) return;
    const len=Math.max(1,Math.floor(c.sampleRate*dur));
    const buf=c.createBuffer(1,len,c.sampleRate), d=buf.getChannelData(0);
    for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,1.6);
    const s=c.createBufferSource(); s.buffer=buf;
    const f=c.createBiquadFilter(); f.type='lowpass';
    f.frequency.setValueAtTime(f0,c.currentTime);
    f.frequency.exponentialRampToValueAtTime(Math.max(40,f1),c.currentTime+dur);
    const g=c.createGain(); g.gain.value=vol;
    s.connect(f); f.connect(g); g.connect(c.destination);
    s.start();
  }
  return {
    init:ac,
    isOn:()=>on,
    set(v){ on=v; if(v) ac(); },
    tick(){ beep(820,0.05,'triangle',0.10,1150); },
    place(){ noise(0.10,2600,500,0.22); beep(190,0.10,'sine',0.13,110); },
    merge(lv){ const f=360*Math.pow(1.16,lv); beep(f,0.15,'triangle',0.16,f*1.7); beep(f*2,0.10,'sine',0.07,f*2.6,0.03); },
    magic(){ [660,880,1175,1568].forEach((f,i)=>beep(f,0.22,'sine',0.14,f*1.15,i*0.075)); },
    boom(){ noise(0.6,2000,70,0.45); beep(95,0.5,'sawtooth',0.20,32); beep(150,0.25,'square',0.10,45,0.02); },
    over(){ [440,370,294,220].forEach((f,i)=>beep(f,0.32,'triangle',0.15,f*0.96,i*0.17)); }
  };
})();

const $=s=>document.querySelector(s);
const boardEl=$('#board'), diceEl=$('#dice'), fxEl=$('#fx'), wellEl=$('#well'),
      pieceEl=$('#piece'), dragEl=$('#drag'), wrapEl=$('#boardWrap');

let board=[], piece=null, score=0, best=0, history=null, busy=false;
let cellSize=40, gap=7, pieceScale=44;

/* ---------- storage ---------- */
function load(){ try{ return JSON.parse(localStorage.getItem('diceMergeSave4')||'null'); }catch(e){ return null; } }
function save(){ try{ localStorage.setItem('diceMergeSave4', JSON.stringify({
  b:board.map(c=>c?c.v:0), p:piece?piece.cells:null, s:score, best:best, snd:SND.isOn() })); }catch(e){} }

/* ---------- grid ---------- */
const slots=[];
for(let i=0;i<N*N;i++){ const d=document.createElement('div'); d.className='slot'; boardEl.appendChild(d); slots.push(d); }

function measure(){
  gap=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--gap'));
  cellSize=(diceEl.clientWidth-gap*(N-1))/N;
  const well=Math.min(diceEl.clientWidth*0.60, 215);
  wellEl.style.width=well+'px'; wellEl.style.height=well+'px';
  pieceScale=Math.min(cellSize*0.80, well*0.30);
  layoutAll(); renderPiece();
}
window.addEventListener('resize',()=>setTimeout(measure,60));
window.addEventListener('orientationchange',()=>setTimeout(measure,250));

/* ---------- die ---------- */
function styleDie(el,v,size){
  const s=SKIN[v]||SKIN[6];
  el.style.setProperty('--c1',s.c1); el.style.setProperty('--c2',s.c2);
  el.style.setProperty('--c3',s.c3); el.style.setProperty('--cdark',s.d);
  el.style.setProperty('--pip',s.pip);
  el.style.setProperty('--lip',Math.max(3,Math.round(size*0.09))+'px');
  el.style.width=size+'px'; el.style.height=size+'px';
}
function makeDie(v,size){
  const el=document.createElement('div');
  el.className='die'+(v===MAGIC?' magic':'');
  styleDie(el,v,size);
  if(v===MAGIC){ el.innerHTML=STAR+'<div class="shine"></div>'; }
  else{
    const p=document.createElement('div'); p.className='pips';
    const on=PIP[v]||[4];
    for(let i=0;i<9;i++){ const sp=document.createElement('span');
      if(on.includes(i)) sp.appendChild(document.createElement('i')); p.appendChild(sp); }
    el.appendChild(p);
  }
  return el;
}
function pos(i){ return {x:(i%N)*(cellSize+gap), y:Math.floor(i/N)*(cellSize+gap)}; }
function center(i){ const p=pos(i); return {x:p.x+cellSize/2, y:p.y+cellSize/2}; }
function place(el,i){ const p=pos(i); el.style.left=p.x+'px'; el.style.top=p.y+'px'; }
function layoutAll(){ for(let i=0;i<N*N;i++){ const c=board[i]; if(!c) continue; styleDie(c.el,c.v,cellSize); place(c.el,i); } }
function setCell(i,v,anim){
  if(board[i]){ board[i].el.remove(); board[i]=null; }
  if(v){ const el=makeDie(v,cellSize); if(anim) el.classList.add('spawn');
    diceEl.appendChild(el); place(el,i); board[i]={v,el}; }
}

/* ---------- piece ---------- */
function maxOnBoard(){ let m=1; board.forEach(c=>{ if(c&&c.v<MAGIC&&c.v>m) m=c.v; }); return m; }
function randVal(){
  const cap=Math.min(6,Math.max(4,maxOnBoard()));
  const w=[]; for(let v=1;v<=cap;v++) w.push(Math.pow(0.78,v-1));
  let r=Math.random()*w.reduce((a,b)=>a+b,0);
  for(let v=1;v<=cap;v++){ r-=w[v-1]; if(r<=0) return v; }
  return 1;
}
function newPiece(){
  const single=Math.random()<0.38;
  if(single) return {cells:[{dx:0,dy:0,v:randVal()}]};
  const vertical=Math.random()<0.5, same=Math.random()<0.45, v0=randVal();
  const shape=vertical?[[0,0],[0,1]]:[[0,0],[1,0]];
  return {cells:shape.map(([dx,dy])=>({dx,dy,v:same?v0:randVal()}))};
}
function rotate(p){
  const maxY=Math.max(...p.cells.map(c=>c.dy));
  p.cells=p.cells.map(c=>({dx:maxY-c.dy, dy:c.dx, v:c.v}));
  const mx=Math.min(...p.cells.map(c=>c.dx)), my=Math.min(...p.cells.map(c=>c.dy));
  p.cells.forEach(c=>{ c.dx-=mx; c.dy-=my; });
}
function renderPiece(){
  pieceEl.innerHTML='';
  if(!piece) return;
  const s=pieceScale, g=Math.max(3,s*0.10);
  const w=Math.max(...piece.cells.map(c=>c.dx))+1, h=Math.max(...piece.cells.map(c=>c.dy))+1;
  pieceEl.style.width=(w*s+(w-1)*g)+'px';
  pieceEl.style.height=(h*s+(h-1)*g)+'px';
  piece.cells.forEach(c=>{
    const d=makeDie(c.v,s);
    d.style.left=(c.dx*(s+g))+'px'; d.style.top=(c.dy*(s+g))+'px';
    pieceEl.appendChild(d);
  });
}

/* ---------- drag / tap-rotate ---------- */
let drag=null;
wellEl.addEventListener('pointerdown', startDrag);
function startDrag(e){
  if(busy||!piece) return;
  e.preventDefault();
  const pr=pieceEl.getBoundingClientRect();
  const s=pieceScale, g=Math.max(3,s*0.10);
  let gx=Math.floor((e.clientX-pr.left)/(s+g)), gy=Math.floor((e.clientY-pr.top)/(s+g));
  const grabbed=piece.cells.find(c=>c.dx===gx&&c.dy===gy)||piece.cells[0];

  dragEl.innerHTML=''; dragEl.style.display='block';
  piece.cells.forEach(c=>{
    const d=makeDie(c.v,cellSize);
    d.style.left=(c.dx*(cellSize+gap))+'px'; d.style.top=(c.dy*(cellSize+gap))+'px';
    dragEl.appendChild(d);
  });
  drag={grabbed,sx:e.clientX,sy:e.clientY,moved:false};
  pieceEl.classList.add('used');
  moveDrag(e);
  document.addEventListener('pointermove',moveDrag);
  document.addEventListener('pointerup',endDrag);
  document.addEventListener('pointercancel',endDrag);
}
function clearHl(){ slots.forEach(s=>s.classList.remove('hl')); }
function targetRC(d,e){
  const br=diceEl.getBoundingClientRect();
  const lift=(e.pointerType==='touch')? cellSize*1.15 : 0;
  const c=Math.round((e.clientX-br.left-cellSize/2-d.grabbed.dx*(cellSize+gap))/(cellSize+gap));
  const r=Math.round((e.clientY-br.top-lift-cellSize/2-d.grabbed.dy*(cellSize+gap))/(cellSize+gap));
  return {r,c};
}
function validAt(r,c){
  const cs=piece.cells.map(cl=>({r:r+cl.dy,c:c+cl.dx,v:cl.v}));
  for(const x of cs){ if(x.r<0||x.r>=N||x.c<0||x.c>=N) return null; if(board[x.r*N+x.c]) return null; }
  return cs;
}
function moveDrag(e){
  if(!drag) return;
  if(Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)>8) drag.moved=true;
  const lift=(e.pointerType==='touch')? cellSize*1.15 : 0;
  dragEl.style.transform=`translate(${e.clientX-cellSize/2-drag.grabbed.dx*(cellSize+gap)}px,${e.clientY-cellSize/2-lift-drag.grabbed.dy*(cellSize+gap)}px)`;
  clearHl();
  const {r,c}=targetRC(drag,e), ok=validAt(r,c);
  if(ok) ok.forEach(x=>slots[x.r*N+x.c].classList.add('hl'));
}
function endDrag(e){
  document.removeEventListener('pointermove',moveDrag);
  document.removeEventListener('pointerup',endDrag);
  document.removeEventListener('pointercancel',endDrag);
  if(!drag) return;
  const d=drag; drag=null;
  dragEl.style.display='none'; dragEl.innerHTML='';
  clearHl(); pieceEl.classList.remove('used');
  if(!d.moved){
    if(piece.cells.length>1){
      rotate(piece); renderPiece(); save(); SND.tick();
      wellEl.classList.remove('spin'); void wellEl.offsetWidth; wellEl.classList.add('spin');
      setTimeout(()=>wellEl.classList.remove('spin'),280);
    }
    return;
  }
  const {r,c}=targetRC(d,e), ok=validAt(r,c);
  if(!ok) return;
  commit(ok);
}

/* ---------- turn ---------- */
async function commit(cells){
  busy=true; history=snapshot();
  const placed=[];
  cells.forEach(x=>{ const i=x.r*N+x.c; setCell(i,x.v,true); placed.push(i); });
  SND.place();
  piece=null; renderPiece(); save();
  await sleep(100);
  await resolveMerges(placed);
  piece=newPiece(); renderPiece();
  save(); updateScore(); busy=false;
  if(!anyMovePossible()) gameOver();
}
function snapshot(){ return {b:board.map(c=>c?c.v:0), p:piece?JSON.parse(JSON.stringify(piece.cells)):null, s:score}; }
function restore(sn){
  for(let i=0;i<N*N;i++) setCell(i,sn.b[i],false);
  piece=sn.p?{cells:sn.p}:newPiece(); score=sn.s;
  renderPiece(); updateScore(); save();
}
function neighbors(i){ const r=Math.floor(i/N),c=i%N,o=[];
  if(r>0)o.push(i-N); if(r<N-1)o.push(i+N); if(c>0)o.push(i-1); if(c<N-1)o.push(i+1); return o; }
function findGroups(){
  const seen=new Array(N*N).fill(false), gs=[];
  for(let i=0;i<N*N;i++){
    if(seen[i]||!board[i]) continue;
    const v=board[i].v,q=[i],comp=[]; seen[i]=true;
    while(q.length){ const cur=q.pop(); comp.push(cur);
      for(const nb of neighbors(cur)) if(!seen[nb]&&board[nb]&&board[nb].v===v){ seen[nb]=true; q.push(nb); } }
    if(comp.length>=3) gs.push({v,comp});
  }
  return gs;
}
async function resolveMerges(placed){
  let anchors=placed.slice();
  while(true){
    const gs=findGroups(); if(!gs.length) break;
    const next=[];
    for(const g of gs){
      // an earlier explosion in this same pass may already have cleared part of this group
      g.comp=g.comp.filter(i=>board[i]&&board[i].v===g.v);
      if(g.comp.length<3) continue;
      let anchor=g.comp.find(i=>anchors.includes(i));
      if(anchor===undefined){
        let bi=g.comp[0],bn=-1;
        for(const i of g.comp){ const n=neighbors(i).filter(x=>g.comp.includes(x)).length; if(n>bn){bn=n;bi=i;} }
        anchor=bi;
      }
      const ap=pos(anchor);
      g.comp.forEach(i=>{ if(i!==anchor){ const el=board[i].el; el.style.left=ap.x+'px'; el.style.top=ap.y+'px'; el.classList.add('suck'); } });
      await sleep(150);
      g.comp.forEach(i=>{ if(i!==anchor){ board[i].el.remove(); board[i]=null; } });

      if(g.v===MAGIC){ await explode(anchor,g.comp); }
      else{
        const nv=g.v+1;
        setCell(anchor,nv,false);
        board[anchor].el.classList.add('pop');
        ringAt(anchor, nv===MAGIC);
        if(nv===MAGIC){ sparkAt(anchor,14); SND.magic(); } else SND.merge(nv);
        const gain=(nv===MAGIC?200:nv*g.comp.length*2);
        score+=gain; updateScore(); floatAt(anchor,'+'+gain);
        next.push(anchor);
      }
    }
    anchors=next;
    await sleep(170);
  }
}
const BLAST=4;  // the blast clears a BLAST x BLAST square
// Top-left corner of the blast window: centred on the magic group, kept inside the board.
function blastOrigin(comp){
  const rs=comp.map(i=>Math.floor(i/N)), cs=comp.map(i=>i%N);
  const cr=rs.reduce((a,b)=>a+b,0)/comp.length, cc=cs.reduce((a,b)=>a+b,0)/comp.length;
  const span=(BLAST-1)/2;
  const lim=Math.max(0,N-BLAST);
  return {
    r0: Math.max(0, Math.min(lim, Math.round(cr-span))),
    c0: Math.max(0, Math.min(lim, Math.round(cc-span)))
  };
}
async function explode(anchor, comp){
  const {r0,c0}=blastOrigin(comp);
  if(board[anchor]){ board[anchor].el.remove(); board[anchor]=null; }
  // centre of the blast window, in pixels
  const cx=((2*c0+BLAST-1)*(cellSize+gap)+cellSize)/2;
  const cy=((2*r0+BLAST-1)*(cellSize+gap)+cellSize)/2;
  boomXY(cx,cy,cellSize*(BLAST+1.4)); sparkXY(cx,cy,32,1.6); SND.boom();
  wrapEl.classList.add('shake'); setTimeout(()=>wrapEl.classList.remove('shake'),400);
  let gain=300;
  for(let r=r0;r<r0+BLAST;r++) for(let c=c0;c<c0+BLAST;c++){
    if(r<0||r>=N||c<0||c>=N) continue;
    const i=r*N+c;
    if(board[i]){ gain+=board[i].v*15; const el=board[i].el; el.classList.add('suck'); board[i]=null; setTimeout(()=>el.remove(),160); }
  }
  score+=gain; updateScore(); floatXY(cx-18,cy-12,'+'+gain);
  await sleep(430);
}

/* ---------- fx ---------- */
function ringAt(i,big){
  const p=center(i), d=document.createElement('div'); d.className='ring';
  const s=cellSize*(big?1.1:0.85);
  d.style.width=s+'px'; d.style.height=s+'px'; d.style.left=p.x+'px'; d.style.top=p.y+'px';
  if(big) d.style.borderColor='rgba(255,220,90,.95)';
  fxEl.appendChild(d); setTimeout(()=>d.remove(),520);
}
function boomXY(x,y,size){
  const d=document.createElement('div'); d.className='boom';
  d.style.width=size+'px'; d.style.height=size+'px'; d.style.left=x+'px'; d.style.top=y+'px';
  fxEl.appendChild(d); setTimeout(()=>d.remove(),600);
}
function sparkXY(x,y,n,spread){
  const p={x,y};
  for(let k=0;k<n;k++){
    const a=Math.random()*Math.PI*2, dist=cellSize*(0.8+Math.random()*1.6)*(spread||1);
    const s=document.createElement('div'); s.className='spark';
    s.style.left=p.x+'px'; s.style.top=p.y+'px';
    s.style.setProperty('--tx',(Math.cos(a)*dist)+'px');
    s.style.setProperty('--ty',(Math.sin(a)*dist)+'px');
    s.style.animationDelay=(Math.random()*90)+'ms';
    fxEl.appendChild(s); setTimeout(()=>s.remove(),750);
  }
}
function floatXY(x,y,txt){
  const f=document.createElement('div'); f.className='float'; f.textContent=txt;
  f.style.left=x+'px'; f.style.top=y+'px';
  fxEl.appendChild(f); setTimeout(()=>f.remove(),860);
}
function sparkAt(i,n){ const p=center(i); sparkXY(p.x,p.y,n); }
function floatAt(i,txt){ const p=center(i); floatXY(p.x-18,p.y-12,txt); }

/* ---------- state ---------- */
function anyMovePossible(){
  if(!piece) return true;
  const variants=[piece.cells];
  if(piece.cells.length>1){ const tmp={cells:piece.cells.map(c=>({...c}))}; rotate(tmp); variants.push(tmp.cells); }
  for(const cells of variants)
    for(let r=0;r<N;r++) for(let c=0;c<N;c++){
      let ok=true;
      for(const cl of cells){ const rr=r+cl.dy, cc=c+cl.dx;
        if(rr<0||rr>=N||cc<0||cc>=N||board[rr*N+cc]){ ok=false; break; } }
      if(ok) return true;
    }
  return false;
}
function updateScore(){
  $('#score').textContent=score;
  if(score>best){ best=score; $('#best').textContent=best; }
  $('#undoBtn').disabled=!history;
}
function gameOver(){
  $('#finalScore').textContent=score;
  $('#bestMsg').textContent=(score>=best)?'🎉 Νέο ρεκόρ!':'Ρεκόρ: '+best;
  $('#over').classList.add('show'); SND.over(); save();
}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

function newGame(){
  board.forEach((c,i)=>{ if(c) setCell(i,0,false); });
  board=new Array(N*N).fill(null); diceEl.innerHTML=''; fxEl.innerHTML='';
  score=0; history=null;
  for(let t=0;t<60;t++){
    board.forEach((c,i)=>{ if(c) setCell(i,0,false); });
    [...Array(N*N).keys()].sort(()=>Math.random()-0.5).slice(0,6)
      .forEach(i=>setCell(i,Math.ceil(Math.random()*3),true));
    if(!findGroups().length) break;
  }
  piece=newPiece(); renderPiece(); updateScore();
  $('#over').classList.remove('show'); save();
}
$('#sndBtn').onclick=()=>{ const v=!SND.isOn(); SND.set(v); $('#sndBtn').textContent=v?'🔊':'🔇'; if(v) SND.tick(); save(); };
document.addEventListener('pointerdown',()=>SND.init(),{once:true});
$('#newBtn').onclick=()=>{ if(!busy && confirm('Νέο παιχνίδι;')) newGame(); };
$('#againBtn').onclick=newGame;
$('#undoBtn').onclick=()=>{ if(history&&!busy){ const h=history; history=null; restore(h); updateScore(); $('#over').classList.remove('show'); } };

/* ---------- init ---------- */
board=new Array(N*N).fill(null);
let sv=load();
if(sv && (!Array.isArray(sv.b) || sv.b.length!==N*N)){ const keep=sv; sv={best:keep.best||0}; }
best=(sv&&sv.best)||0; $('#best').textContent=best;
if(sv && sv.snd===false){ SND.set(false); $('#sndBtn').textContent='🔇'; }
measure();
if(sv&&sv.b&&sv.b.some(v=>v)){
  score=sv.s||0;
  piece=sv.p?{cells:sv.p}:newPiece();
  sv.b.forEach((v,i)=>{ if(v) setCell(i,v,false); });
  renderPiece(); updateScore();
  if(!anyMovePossible()) gameOver();
}else newGame();
setTimeout(measure,150);
})();
</script>

if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
